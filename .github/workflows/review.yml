name: Check demonstration on desktop and mobile
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node --check app.js
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-review
          path: review/
          retention-days: 7
