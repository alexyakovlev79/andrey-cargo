name: Check demonstration on desktop and mobile
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node --check app.js
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Check local source
        run: node scripts/check-ui.cjs
      - name: Wait for matching published page
        run: |
          node <<'JS'
          const fs = require('node:fs');
          (async () => {
            const expected = fs.readFileSync('index.html', 'utf8');
            const url = 'https://alexyakovlev79.github.io/andrey-cargo/?revision=' + process.env.GITHUB_SHA;
            for (let attempt = 0; attempt < 12; attempt++) {
              try {
                const response = await fetch(url, { signal: AbortSignal.timeout(10000) });
                if (response.ok && await response.text() === expected) {
                  console.log('The published page matches this checkout.');
                  return;
                }
              } catch (error) { console.log(error.message); }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('The published page did not match this checkout within the deployment window.');
          })().catch(error => { console.error(error); process.exit(1); });
          JS
      - name: Check live GitHub Pages on desktop and mobile
        env:
          REVIEW_URL: https://alexyakovlev79.github.io/andrey-cargo/
        run: node scripts/check-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-review
          path: review/
          retention-days: 7
