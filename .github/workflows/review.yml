name: Check demonstration on desktop and mobile
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stop previous unfinished check
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.actions.cancelWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id: 38377005921});
            } catch (error) {
              if (error.status !== 409) throw error;
            }
      - uses: actions/checkout@v4
      - run: node --check app.js
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-review
          path: review/
          retention-days: 7
